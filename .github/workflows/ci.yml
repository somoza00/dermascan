name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dermascan-api
    env:
      # Sem checkpoint treinado no repo (gitignored), a API recusa subir
      # por padrão (ver app/services/inference.py) — os testes de rota
      # precisam do modo mock explicitamente habilitado. Os testes que
      # exercitam o próprio gate (tests/test_inference_gate.py) sobrescrevem
      # isso via monkeypatch quando precisam do valor oposto.
      ALLOW_MOCK_INFERENCE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dermascan-api/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -q

  model:
    name: Model (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dermascan-model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dermascan-model/requirements-dev.txt

      # requirements.txt fixa só "torch>=2.1.0" / "torchvision>=0.16.0", sem
      # index de CPU (ao contrário de dermascan-api/requirements.txt) — sem
      # isto, pip resolve pra build CUDA do PyPI (~2.5GB) e o job fica lento
      # ou estoura espaço/tempo no runner. Instala a variante +cpu primeiro,
      # explícita: o install de requirements-dev.txt depois já encontra as
      # constraints satisfeitas e não baixa a build CUDA por cima.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - run: pip install -r requirements-dev.txt

      - run: pytest -q

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dermascan-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dermascan-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      # `tsc -b && vite build` — o type-check roda como parte do build
      # (tsconfig do projeto não usa noEmit isolado), não precisa de um
      # passo `tsc --noEmit` separado.
      - run: npm run build
