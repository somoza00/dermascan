server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo existente cai no
    # index.html (o roteamento, se algum dia existir, é client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite) podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
