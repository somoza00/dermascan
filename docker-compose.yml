# Sobe API + frontend juntos: `docker compose up --build`.
#
# Modelo: a API recusa subir servindo predições sintéticas sem sinalização
# explícita (ver ALLOW_MOCK_INFERENCE em dermascan-api/app/services/
# inference.py) — mas esse compose é o caminho de "baixei o projeto pra
# testar", então ALLOW_MOCK_INFERENCE default true aqui embaixo permite
# subir em modo mock sem o checkpoint (~46MB, gitignored). Pra usar o
# modelo real:
#   - local: coloque o arquivo em dermascan-api/models/dermascan_v1.pt
#     antes de rodar `docker compose up --build`; ou
#   - remoto: defina MODEL_PATH=https://.../dermascan_v1.pt (ex.: um
#     GitHub Release) num arquivo .env ao lado deste compose, ou
#     `MODEL_PATH=... docker compose up`.
# Em qualquer um dos dois casos o checkpoint tem prioridade sobre o mock,
# então ALLOW_MOCK_INFERENCE=true não impede o modelo real de ser usado
# quando ele está disponível. Fora deste compose (ex.: Railway), NÃO
# defina ALLOW_MOCK_INFERENCE — o default (false) é o que garante que um
# MODEL_PATH mal configurado em produção derruba o deploy em vez de
# servir predições sintéticas silenciosamente.
#
# CORS: o CORS_ORIGINS padrão da API já libera http://localhost:5173 (ver
# dermascan-api/app/main.py), que é onde o serviço "web" abaixo fica
# publicado — não precisa configurar nada extra pra esse cenário local.

services:
  api:
    build:
      context: ./dermascan-api
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: ${MODEL_PATH:-}
      ALLOW_MOCK_INFERENCE: ${ALLOW_MOCK_INFERENCE:-true}

  web:
    build:
      context: ./dermascan-web
      args:
        # O browser roda fora da rede do Docker e acessa a API pela porta
        # publicada no host — por isso localhost:8000, não "http://api:8000".
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
